<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select source to capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      background: #1a1a2e;
      color: #eee;
    }
    h2 { margin-bottom: 12px; font-size: 14px; }
    .sources {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .source {
      cursor: pointer;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .source:hover { border-color: #4a9eff; }
    .source img {
      width: 100%;
      height: 84px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .source span {
      font-size: 11px;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h2>Select screen or window to capture (with audio)</h2>
  <p style="font-size:12px;color:#888;margin-bottom:12px;">Click a source below. "Entire screen" captures system audio from your speakers.</p>
  <div class="sources" id="sources">
    <span style="color:#888">Loading sources...</span>
  </div>
  <script>
    window.electronAPI?.on?.('picker-sources', (sources) => {
      const el = document.getElementById('sources');
      if (!sources || sources.length === 0) {
        el.innerHTML = '<span style="color:#f44">No sources found. Try closing and starting again.</span>';
        return;
      }
      el.innerHTML = sources.map(s => `
        <div class="source" data-id="${s.id}">
          <img src="${s.thumbnail || ''}" alt="" onerror="this.style.background='#333'">
          <span>${(s.name || 'Unknown').replace(/</g, '&lt;')}</span>
        </div>
      `).join('');
      el.querySelectorAll('.source').forEach(node => {
        node.onclick = () => window.electronAPI?.send?.('source-picked', node.dataset.id);
      });
    });
  </script>
</body>
</html>
