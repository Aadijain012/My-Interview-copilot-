<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant - Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    h1 { font-size: 18px; }
    p { font-size: 13px; color: #aaa; text-align: center; max-width: 320px; }
    button {
      padding: 12px 24px;
      font-size: 14px;
      background: #4a9eff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #3a8eef; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>AI Assistant - System Audio Capture</h1>
  <p>Capture system audio (Google Meet, Zoom, etc.) or use your microphone. Transcripts appear in the terminal.</p>
  <button id="startBtn">Start (system audio)</button>
  <button id="micBtn">Start (microphone)</button>
  <button id="stopBtn" style="background: #e55; display: none;">Stop</button>
  <p id="statusMsg" style="font-size: 12px; color: #8af; min-height: 20px;"></p>

  <script>
    // Audio capture - inline to avoid path issues
    const BUFFER_SIZE = 4096;
    let audioContext = null, sourceNode = null, processorNode = null, stream = null;

    function float32ToInt16(float32) {
      const int16 = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return int16.buffer;
    }

    async function getMicrophoneStream() {
      try { return await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) {
        if (!/device|not found/i.test(String(e.message || e.name))) throw e;
      }
      try { return await navigator.mediaDevices.getUserMedia({ audio: {} }); } catch (e2) {
        if (!/device|not found/i.test(String(e2.message || e2.name))) throw e2;
      }
      const devices = await navigator.mediaDevices.enumerateDevices();
      const audioInput = devices.find(d => d.kind === 'audioinput' && d.deviceId && d.deviceId !== 'default');
      if (audioInput?.deviceId) {
        try { return await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { ideal: audioInput.deviceId } } }); } catch (_) {}
      }
      throw new Error('No microphone found. Try "Start (system audio)" instead.');
    }

    async function startCapture(useMicrophone) {
      try {
        let displayStream;
        if (useMicrophone) {
          displayStream = await getMicrophoneStream();
        } else {
          displayStream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
          displayStream.getVideoTracks().forEach(t => { t.stop(); displayStream.removeTrack(t); });
        }
        stream = displayStream;
        const audioTrack = displayStream.getAudioTracks()[0];
        if (!audioTrack) {
          window.electronAPI?.send?.('capture-error', 'No audio track');
          return;
        }
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
        if (audioContext.state === 'suspended') await audioContext.resume();
        const actualRate = audioContext.sampleRate;
        const audioOnlyStream = new MediaStream([audioTrack]);
        sourceNode = audioContext.createMediaStreamSource(audioOnlyStream);
        processorNode = audioContext.createScriptProcessor(BUFFER_SIZE, 1, 1);
        processorNode.onaudioprocess = (e) => {
          const pcm = float32ToInt16(e.inputBuffer.getChannelData(0));
          if (window.electronAPI?.sendAudioChunk) window.electronAPI.sendAudioChunk(pcm);
          else window.electronAPI?.send?.('audio-chunk', pcm);
        };
        const gainNode = audioContext.createGain();
        gainNode.gain.value = 0;
        sourceNode.connect(processorNode);
        processorNode.connect(gainNode);
        gainNode.connect(audioContext.destination);
        window.electronAPI?.send?.('capture-started', actualRate);
      } catch (err) {
        window.electronAPI?.send?.('capture-error', err.message || 'Capture failed');
      }
    }

    function stopCapture() {
      if (processorNode) { try { processorNode.disconnect(); } catch (_) {} processorNode.onaudioprocess = null; processorNode = null; }
      if (sourceNode) { try { sourceNode.disconnect(); } catch (_) {} sourceNode = null; }
      if (audioContext) { audioContext.close().catch(() => {}); audioContext = null; }
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      window.electronAPI?.send?.('capture-stopped');
    }

    window.audioCapture = { startCapture, stopCapture };
  </script>

  <script>
    // UI logic
    document.addEventListener('DOMContentLoaded', () => {
      const startBtn = document.getElementById('startBtn');
      const micBtn = document.getElementById('micBtn');
      const stopBtn = document.getElementById('stopBtn');
      const statusMsg = document.getElementById('statusMsg');

      const setStatus = (s) => { statusMsg.textContent = s || ''; };
      const disableBoth = () => { startBtn.disabled = true; micBtn.disabled = true; };
      const enableBoth = () => { startBtn.disabled = false; micBtn.disabled = false; stopBtn.style.display = 'none'; };

      startBtn.onclick = () => {
        disableBoth();
        setStatus('Starting system audio... Select a screen/window when prompted.');
        window.electronAPI?.send?.('prepare-capture', false);
      };
      micBtn.onclick = () => {
        disableBoth();
        setStatus('Requesting microphone... (allow when prompted)');
        window.electronAPI?.send?.('prepare-capture', true);
      };
      stopBtn.onclick = () => { window.audioCapture?.stopCapture(); };

      window.electronAPI?.on?.('do-capture', (useMicrophone) => {
        setStatus(useMicrophone ? 'Opening microphone...' : 'Select screen to share for system audio...');
        window.audioCapture?.startCapture(useMicrophone);
      });
      window.electronAPI?.on?.('capture-started', () => {
        stopBtn.style.display = 'block';
        setStatus('Listening... Transcripts appear in the terminal.');
      });
      window.electronAPI?.on?.('capture-stopped', () => { enableBoth(); setStatus(''); });
      window.electronAPI?.on?.('capture-error', (msg) => {
        enableBoth();
        setStatus('Error: ' + (msg || 'Capture failed'));
      });
    });
  </script>
</body>
</html>
